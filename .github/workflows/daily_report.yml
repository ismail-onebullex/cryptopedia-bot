name: Daily Cryptopedia Report
on:
  schedule:
      - cron: '0 6 * * *'
        workflow_dispatch:
        jobs:
          send-report:
              runs-on: ubuntu-latest
                  steps:
                        - uses: actions/checkout@v3
                              - name: Setup Python
                                      uses: actions/setup-python@v4
                                              with:
                                                        python-version: '3.10'
                                                              - name: Install requests
                                                                      run: pip install requests
                                                                            - name: Run report
                                                                                    run: python cryptopedia_report.py
