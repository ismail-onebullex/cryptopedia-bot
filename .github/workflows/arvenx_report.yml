name: ArvenX Rapor
on:
  workflow_dispatch:
  permissions:
    contents: write
    jobs:
      send-report:
          runs-on: ubuntu-latest
              steps:
                    - uses: actions/checkout@v3
                          - name: Setup Python
                                  uses: actions/setup-python@v4
                                          with:
                                                    python-version: '3.10'
                                                          - name: Install dependencies
                                                                  run: pip install requests pytz
                                                                        - name: Run report
                                                                                run: python arvenx_report.py report
